# Database URL format: jdbc:mysql://localhost:port/DATABASE_NAME
spring.datasource.url=jdbc:mysql://localhost:3306/garage_db?allowPublicKeyRetrieval=true&useSSL=false
# The MySQL username you log into Workbench with (usually "root")
spring.datasource.username=root

# The actual password you type when opening your ScannerPoint_DB connection in Workbench
spring.datasource.password=wsPh#2004

# JPA / Hibernate settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081