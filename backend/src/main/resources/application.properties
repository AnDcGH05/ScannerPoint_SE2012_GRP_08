spring.application.name=ScannerPoint

# ---------------------------------------------------------------------
# Database: the tables, triggers, procedure and view come from
# 01_schema.sql + 02_data.sql (run them in MySQL first).
# Hibernate only CHECKS that our entities match those tables (validate);
# it never creates or changes tables.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/scannerpoint?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
server.error.include-message=always

# File uploads (vehicle documents and payment slips)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# Login tokens. Override JWT_SECRET on a real server (at least 32 characters).
app.jwt.secret=${JWT_SECRET:scannerpoint-dev-secret-change-me-0123456789}
app.jwt.expiry-hours=12

# React dev server
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Bank account shown on the "Pay by bank transfer" panel.
# Put the real name and number in environment variables, never in Git.
app.bank.name=HNB
app.bank.branch=Kurunegala
app.bank.account-name=${BANK_ACCOUNT_NAME:ScannerPoint (Pvt) Ltd}
app.bank.account-no=${BANK_ACCOUNT_NO:000000000000}

# E-mail notifications: leave spring.mail.host empty to only log e-mails to the console.
# For Mailtrap/Gmail put the settings in application-local.properties.
app.mail.from=noreply@scannerpoint.lk

# Daily service reminders (predictive maintenance) at 08:00
app.reminders.cron=0 0 8 * * *

# Set to true ONCE to give every account the password Demo@1234 (02_data.sql has placeholder hashes)
app.demo.reset-passwords=false
app.demo.password=Demo@1234

# Private per-developer settings (DB password, mail). See application-local.properties.example
spring.config.import=optional:classpath:application-local.properties
